# Settings for attention.sh (sourced as shell). Changes apply to the next event,
# no restart needed. Every line shows the built-in default; uncomment one to
# change it. Defaults left commented out follow upgrades of the script.

# When to show a pop-up:
#   auto   - only when Claude is blocked and you're not looking at the terminal
#   always - even if the terminal is in front
#   never  - tab/dock/taskbar markers only
#POPUP=auto

# Seconds to wait before the "done, your turn" pop-up.
#DELAY=60

# Which pop-ups play a sound: blocking (permission/question/plan) | all | none
#SOUND=blocking

# 1 = send the terminal bell (tab 🔔, dock badge/bounce, taskbar flash).
# If your terminal beeps on it, switch its bell to visual instead (see README).
#BELL=1

# After a pop-up, one reminder after this many minutes if you still haven't
# answered (0 = off).
#REMIND_MIN=0

# Idle this long (seconds) counts as "away", even if the terminal is in front.
#AWAY_SEC=120

# Terminals (TERM_PROGRAM values) to ignore entirely, e.g. "vscode".
#SKIP_TERMINALS=""

# Terminals whose built-in Claude notifications already cover permission,
# input and idle pop-ups (set preferredNotifChannel to auto). Set this to ""
# if you turned those off and want the hook to send them instead.
#BUILTIN_TERMINALS="ghostty iTerm.app kitty"

# macOS sound name (see /System/Library/Sounds).
#MAC_SOUND=Glass

# Mute pop-ups temporarily:  touch ~/.claude/hooks/attention.mute
