# Settings for attention.sh (sourced as shell). Changes apply to the next event,
# no restart needed. Every line shows the built-in default; uncomment one to
# change it. Defaults left commented out follow upgrades of the script.

# 1 = send the terminal bell (tab 🔔, dock badge/bounce, taskbar flash).
# If your terminal beeps on it, switch its bell to visual instead (see README).
#BELL=1

# Ring the bell again every this many seconds while Claude waits (0 = off).
# Each bell bounces the dock icon once, so this keeps it bouncing. Stops when
# you respond, after 30 minutes, or (macOS) once you bring the terminal to the
# front, even if you leave again without answering.
#NAG_SEC=0

# 1 = while Claude waits, the tab title shows "<mark> <project>" (macOS/Linux).
# Claude's own title comes back once you respond. In Ghostty, add
# `bell-features = no-title` to its config to drop the 🔔 in front of it.
#TITLE=1
#MARK_PERMISSION="🔐" MARK_QUESTION="🙋" MARK_PLAN="📋" MARK_INPUT="✍️" MARK_ERROR="⚠️" MARK_DONE="👀"

# "Done" less than this many seconds after you sent your prompt (or answered
# one of Claude's) is a short turn you were probably watching: it shows only the
# title mark (and the tab ring, where used) at first (0 = always ring at once).
#SHORT_TURN_SEC=30
# ...then rings the bell if you still haven't responded this many seconds
# later (0 = never ring for short turns).
#SHORT_TURN_BELL_SEC=60

# "Done" waits while Claude's background agents run, however long they take.
# When only background shells are left running, it waits this many minutes
# for Claude to resume, then shows anyway: the shell may be a server that never
# exits (0 = don't wait for shells).
#BG_SHELL_MIN=10

# Terminals (TERM_PROGRAM values) to ignore entirely, e.g. "vscode".
#SKIP_TERMINALS=""
